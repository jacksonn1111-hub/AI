<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>안경 착용 조사</title>
<style>
:root{--navy:#1F3864;--line:#e3e7ef;--pastel:#e8eefc;--ok:#dff3e4;--warn:#fff3d6}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f5f7fb;color:#1c2333}
header{background:var(--navy);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:20px}
header p{margin:6px 0 0;font-size:13px;opacity:.85}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h2{font-size:15px;margin:0 0 10px;color:var(--navy)}
.grade{font-size:12px;color:#6b7690;margin:10px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;min-width:58px}
.chip.doneC{background:var(--ok)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.name{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 6px;text-align:center}
.name small{color:#6b7690;margin-right:4px}
.name.done{background:var(--ok)}
.name.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:bold}
.name.on small{color:#cfd8ee}
.sum{margin:12px 0;padding:10px;background:var(--pastel);border-radius:8px;font-size:14px;line-height:1.6}
.note{font-size:13px;color:#6b7690;margin:4px 0 10px}
.note.warn{background:var(--warn);color:#6b5200;padding:8px 10px;border-radius:8px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.choice button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:16px 8px;font-size:16px}
.choice button.on{border-color:var(--navy);background:var(--pastel);font-weight:bold}
.submit{width:100%;border:0;background:var(--navy);color:#fff;border-radius:10px;padding:14px;font-size:16px}
.submit:disabled{opacity:.4}
.msg{text-align:center;padding:24px 8px}
.msg b{font-size:18px;color:var(--navy)}
.err{color:#b3261e;font-size:14px;padding:8px}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>안경 착용 조사</h1>
  <p>반장이 우리 반 전체를 한 번에 입력해 주세요.</p>
</header>
<main>
  <div id="status" class="card">불러오는 중...</div>
  <div id="s1" class="card hide"><h2>1. 우리 반 선택</h2><div id="classes"></div>
    <div class="note">초록색은 이미 제출한 반이에요.</div></div>
  <div id="s2" class="card hide">
    <h2 id="t2">2. 안경 쓴 친구를 모두 눌러 주세요</h2>
    <div id="again" class="note warn hide">이미 제출한 반이에요. 이전에 선택한 친구들이 체크돼 있어요. 고친 뒤 다시 제출하면 새로 저장돼요.</div>
    <div class="note">평소 안경을 쓰고 생활하는 친구만 누르면 돼요. 다시 누르면 취소돼요.</div>
    <div id="names" class="names"></div>
    <div id="sum" class="sum"></div>
    <button id="send" class="submit" type="button">제출하기</button>
    <div id="err" class="err"></div>
  </div>
  <div id="fin" class="card msg hide"><b>제출 완료!</b><p id="finTxt"></p>
    <button id="next" class="chip" type="button">처음으로</button></div>
</main>
<script>
// ★ Apps Script 웹앱 URL(배포 후 받은 .../exec 주소)을 붙여 넣으세요
const API = 'https://script.google.com/macros/s/AKfycbyy8qkWCa6P9fHSIdce1wIE2tuOUKA93f5Y99N5zNopWeM-OcOgea4MWRUXHtpz-dOd/exec';

let yesCount = 0, students = [], done = new Set(), yes = new Set(), cls = null, picked = new Set();
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(x => { if (x != null) e.append(x); });
  return e;
}
function show(ids) {
  ['s1', 's2', 'fin'].forEach(i => $(i).classList.toggle('hide', !ids.includes(i)));
}
const members = () => students.filter(s => s.g === cls.g && s.c === cls.c).sort((a, b) => a.n - b.n);

async function load() {
  if (API.includes('PASTE_')) { $('status').textContent = '설정 오류: index.html의 API 주소를 입력해 주세요.'; return; }
  try {
    const r = await fetch(API + '?action=roster&t=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    students = j.students;
    done = new Set(j.done.map(d => d[0] + '-' + d[1]));
    yes = new Set((j.yes || []).map(d => d.join('-')));
    yesCount = (j.yes || []).length;
    $('status').classList.add('hide');
    renderClasses(); show(['s1']);
  } catch (e) {
    $('status').textContent = '불러오지 못했어요. 잠시 후 다시 시도해 주세요. (' + e.message + ')';
  }
}

function renderClasses() {
  const box = $('classes'); box.replaceChildren();
  const map = {};
  students.forEach(s => { (map[s.g] = map[s.g] || new Set()).add(s.c); });
  Object.keys(map).sort().forEach(g => {
    box.append(h('div', { class: 'grade' }, g + '학년'));
    const row = h('div', { class: 'row' });
    [...map[g]].sort((a, b) => a - b).forEach(c => {
      row.append(h('button', {
        class: 'chip' + (done.has(g + '-' + c) ? ' doneC' : ''), type: 'button',
        onclick: () => { cls = { g: +g, c }; picked = new Set(members().filter(s => yes.has(s.g + '-' + s.c + '-' + s.n)).map(s => s.n)); $('err').textContent = ''; renderNames(); show(['s2']); window.scrollTo(0, 0); }
      }, c + '반' + (done.has(g + '-' + c) ? ' ✓' : '')));
    });
    box.append(row);
  });
}

function renderNames() {
  $('t2').textContent = cls.g + '학년 ' + cls.c + '반 · 안경 쓴 친구를 모두 눌러 주세요';
  $('again').classList.toggle('hide', !done.has(cls.g + '-' + cls.c));
  const box = $('names'); box.replaceChildren();
  members().forEach(s => {
    box.append(h('button', {
      class: 'name' + (picked.has(s.n) ? ' on' : ''), type: 'button',
      onclick: () => { picked.has(s.n) ? picked.delete(s.n) : picked.add(s.n); renderNames(); }
    }, h('small', {}, s.n + '번'), s.name));
  });
  const sel = members().filter(s => picked.has(s.n));
  $('sum').textContent = '👓 안경 쓴 친구 ' + sel.length + '명 / 반 전체 ' + members().length + '명' +
    (sel.length ? ' — ' + sel.map(s => s.name).join(', ') : '') +
    '  [서버 기록 ' + yesCount + '건 · v3]';
}

$('send').onclick = async () => {
  if (!cls) return;
  const sel = members().filter(s => picked.has(s.n));
  const ask = cls.g + '학년 ' + cls.c + '반 안경 쓴 친구 ' + sel.length + '명' + (sel.length ? '\n(' + sel.map(s => s.name).join(', ') + ')' : '') + '\n제출할까요?';
  if (!confirm(ask)) return;
  $('send').disabled = true; $('send').textContent = '제출 중...'; $('err').textContent = '';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ g: cls.g, c: cls.c, glasses: sel.map(s => s.n) }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    done.add(cls.g + '-' + cls.c);
    members().forEach(s => { const k = s.g + '-' + s.c + '-' + s.n; picked.has(s.n) ? yes.add(k) : yes.delete(k); });
    $('finTxt').textContent = cls.g + '학년 ' + cls.c + '반 응답이 저장되었어요. (안경 ' + j.glasses + '명 / 전체 ' + j.total + '명)';
    show(['fin']);
  } catch (e) {
    $('err').textContent = '제출에 실패했어요. 다시 눌러 주세요. (' + e.message + ')';
  }
  $('send').disabled = false; $('send').textContent = '제출하기';
};
$('next').onclick = () => { cls = null; renderClasses(); show(['s1']); };

load();
</script>
</body>
</html>
